<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login | Sylvia The Hairdresser
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


<div class="login-container">


    <div class="login-logo">

        <h1>
            SYLVIA
        </h1>

        <p>
            THE HAIRDRESSER
        </p>

    </div>



    <div class="login-box">

        <h2>
            Admin Login
        </h2>


        <p class="login-description">
            Sign in to manage the salon website.
        </p>



        <form id="login-form">


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="Admin email">

            </div>



            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    placeholder="Password">

            </div>



            <button
                type="submit"
                class="btn full-btn">

                LOGIN

            </button>


            <div id="login-message"></div>


        </form>

    </div>



    <a href="index.html" class="back-home">
        ← Back to Website
    </a>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="login.js"></script>


</body>

</html>
