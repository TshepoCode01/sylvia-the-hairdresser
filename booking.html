        Book Appointment | Sylvia The Hairdresser
    </title>

</head>


<body>

     NAVIGATION
=========================================== -->

        </a>

        </a>

        <a href="booking.html">
            Book Now
        </a>

    </nav>

</header>



<!-- ==========================================
     PAGE HEADER
=========================================== -->

<section class="page-header">

    <h1>
        Book Appointment
    </h1>

    <p>
        Choose your service and preferred appointment time.
    </p>

</section>



<!-- ==========================================
     BOOKING FORM
=========================================== -->

<section class="booking-section">

    <div class="booking-box">

        <h2>
            Appointment Details
        </h2>


        <form id="booking-form">


            <!-- NAME + PHONE -->

            <div class="form-row">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                        placeholder="Enter your full name">

                </div>



                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        required
                        placeholder="Enter your phone number">

                </div>


            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email">

            </div>



            <!-- SERVICE -->

            <div class="form-group">

                <label for="service">
                    Select Service
                </label>

                <select
                    id="service"
                    required>

                    <option value="">
                        Loading services...
                    </option>

                </select>

            </div>



            <!-- DATE + TIME -->

            <div class="form-row">


                <div class="form-group">

                    <label for="date">
                        Appointment Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required>

                </div>



                <div class="form-group">

                    <label for="time">
                        Appointment Time
                    </label>

                    <input
                        type="time"
                        id="time"
                        required>

                </div>


            </div>



            <!-- MESSAGE -->

            <div class="form-group">

                <label for="message">
                    Additional Message
                </label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Anything Sylvia should know?"></textarea>

            </div>



            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn full-btn">

                CONFIRM BOOKING

            </button>



            <!-- BOOKING MESSAGE -->

            <div
                id="booking-message">

            </div>


        </form>


    </div>

</section>
