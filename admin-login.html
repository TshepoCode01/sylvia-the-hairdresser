<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login | Sylvia The Hairdresser
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="admin-body">


<header class="admin-header">

    <div class="admin-brand">

        <h2>
            SYLVIA THE HAIRDRESSER
        </h2>

        <span>
            Admin Login
        </span>

    </div>

</header>



<main class="admin-container">


    <section class="admin-login-box">

        <h1>
            Admin Login
        </h1>

        <p>
            Sylvia, login to manage your bookings,
            services and gallery.
        </p>


        <form id="admin-login-form">


            <div class="form-group">

                <label for="admin-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Enter admin email"
                    required>

            </div>



            <div class="form-group">

                <label for="admin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter password"
                    required>

            </div>



            <button
                type="submit"
                class="btn full-btn">

                LOGIN

            </button>


            <p id="login-message"></p>


        </form>


    </section>


</main>



<footer>

    <div class="footer-logo">
        SYLVIA THE HAIRDRESSER
    </div>

    <p>
        © 2026 Sylvia The Hairdresser.
    </p>

</footer>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script src="supabase.js"></script>


<script>

const loginForm =
    document.getElementById(
        "admin-login-form"
    );


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById(
                "admin-email"
            ).value.trim();


        const password =
            document.getElementById(
                "admin-password"
            ).value;


        const message =
            document.getElementById(
                "login-message"
            );


        message.textContent =
            "Logging in...";


        const {
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            message.textContent =
                "Login failed: "
                + error.message;

            message.style.color =
                "red";

            return;

        }


        message.textContent =
            "Login successful. Opening dashboard...";


        message.style.color =
            "green";


        window.location.href =
            "admin.html";

    }
);

</script>


</body>

</html>
